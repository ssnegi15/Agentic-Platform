name: Agentic Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run bootstrap
        run: |
          python scripts/bootstrap.py

      - name: Show generated project
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 4 -type f | sort
          echo "==================="

      - name: Verify bootstrap
        run: |
          if [ ! -f "./pyproject.toml" ]; then
            echo "::error::bootstrap.py did not create pyproject.toml"
            echo "Repository root:"
            pwd
            echo "Files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "./README.md" ]; then
            echo "::error::bootstrap.py did not create README.md"
            exit 1
          fi

          if [ ! -f "./.env.example" ]; then
            echo "::error::bootstrap.py did not create .env.example"
            exit 1
          fi

          if [ ! -d "./src/agent_platform" ]; then
            echo "::error::bootstrap.py did not create src/agent_platform"
            exit 1
          fi

          echo "Bootstrap verification passed."

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Format
        run: |
          uv run ruff format --check .

      - name: Lint
        run: |
          uv run ruff check .

      - name: Type check
        run: |
          uv run mypy src

      - name: Tests
        run: |
          uv run pytest

      - name: Evaluations
        run: |
          uv run python -m agent_platform.evaluations.runner

      - name: Commit generated project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: generate agent platform"
            git push
          fi
