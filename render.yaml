services:
  - type: web
    name: agent-platform-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        value: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
      - key: TELEMETRY_CAPTURE_INPUTS
        value: "false"
      - key: TELEMETRY_CAPTURE_OUTPUTS
        value: "false"
